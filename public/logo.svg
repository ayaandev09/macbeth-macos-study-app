<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Royal Scottish Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="65%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <radialGradient id="goldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#92400e" stop-opacity="0"/>
    </radialGradient>

    <!-- Royal Velvet Crimson -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="35%" stop-color="#e11d48"/>
      <stop offset="70%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>

    <!-- Steel Blade Gradients -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Ambient Royal Halo Aura -->
  <circle cx="256" cy="256" r="240" fill="url(#goldAura)"/>

  <!-- Outer Golden Royal Shield Frame -->
  <circle cx="256" cy="256" r="230" fill="#0b0f19" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.95"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="8 8" stroke-opacity="0.65"/>

  <!-- Dunsinane Royal Scottish Crown -->
  <!-- Velvet Cap of Estate -->
  <path
    d="M 148 318 C 148 226, 186 172, 256 166 C 326 172, 364 226, 364 318 Z"
    fill="url(#crimsonGrad)"
    stroke="#f43f5e"
    stroke-width="3"
    stroke-opacity="0.6"
  />

  <!-- Golden Crown Peak Arches (Bold Silhouette) -->
  <path
    d="M 132 318 L 152 216 L 196 268 L 256 160 L 316 268 L 360 216 L 380 318 Z"
    fill="url(#goldGrad)"
    stroke="#fef08a"
    stroke-width="5"
    stroke-linejoin="round"
  />

  <!-- Crown Base Band (Solid Gold with Highlights) -->
  <path
    d="M 132 318 C 190 338, 322 338, 380 318 L 372 360 C 318 382, 194 382, 140 360 Z"
    fill="url(#goldGrad)"
    stroke="#fef08a"
    stroke-width="4"
  />

  <!-- Royal Crown Jewels Inset -->
  <circle cx="174" cy="344" r="8" fill="#e11d48" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="215" cy="351" r="9" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="256" cy="353" r="11" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="297" cy="351" r="9" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="338" cy="344" r="8" fill="#e11d48" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Golden Peak Orb Finials -->
  <circle cx="152" cy="212" r="10" fill="#fef08a" stroke="#d97706" stroke-width="2"/>
  <circle cx="360" cy="212" r="10" fill="#fef08a" stroke="#d97706" stroke-width="2"/>

  <!-- Spectral Dagger of the Mind (Central Vertical Piercing Blade) -->
  <!-- Jeweled Spherical Pommel -->
  <circle cx="256" cy="80" r="12" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="3"/>

  <!-- Dagger Grip -->
  <rect x="250" y="92" width="12" height="34" rx="3" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5"/>

  <!-- Crossguard -->
  <path
    d="M 218 126 C 240 131, 272 131, 294 126 L 298 138 C 272 144, 240 144, 214 138 Z"
    fill="url(#goldGrad)"
    stroke="#fef08a"
    stroke-width="2.5"
  />

  <!-- Gleaming Steel Blade with Crimson Bloodline -->
  <path
    d="M 246 142 L 256 310 L 266 142 Z"
    fill="url(#bladeGrad)"
    stroke="#cbd5e1"
    stroke-width="2"
  />
  <line x1="256" y1="144" x2="256" y2="296" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>

  <!-- Blood Drop at the tip -->
  <circle cx="256" cy="316" r="4.5" fill="#e11d48"/>
</svg>
