<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="mbGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <filter id="royalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Glow & Shield Plate -->
  <circle cx="256" cy="256" r="236" fill="url(#mbGlow)"/>
  <circle cx="256" cy="256" r="220" fill="#090d16" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="208" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.4"/>

  <!-- Dunsinane Royal Scottish Crown -->
  <g filter="url(#royalShadow)">
    <!-- Crown Base Band -->
    <path d="M 146 325 C 200 342, 312 342, 366 325 L 358 355 C 310 370, 202 370, 154 355 Z" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1.5"/>
    
    <!-- Crown Band Jewels -->
    <circle cx="180" cy="344" r="5" fill="#f43f5e"/>
    <circle cx="218" cy="348" r="6" fill="#10b981"/>
    <circle cx="256" cy="349" r="7" fill="#38bdf8"/>
    <circle cx="294" cy="348" r="6" fill="#10b981"/>
    <circle cx="332" cy="344" r="5" fill="#f43f5e"/>

    <!-- Velvet Cap interior of Scottish Crown -->
    <path d="M 160 325 C 160 250, 190 200, 256 195 C 322 200, 352 250, 352 325 Z" fill="url(#crimsonGrad)" opacity="0.95"/>

    <!-- Golden Arches and Peaks -->
    <path d="M 146 325 L 160 240 L 195 285 L 256 185 L 317 285 L 352 240 L 366 325 Z" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="2"/>

    <!-- Fleur-de-lis and Cross Pattée Crest Finial -->
    <path d="M 256 155 L 261 170 L 276 170 L 264 179 L 268 194 L 256 185 L 244 194 L 248 179 L 236 170 L 251 170 Z" fill="#fef08a"/>
    <circle cx="256" cy="148" r="8" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="2"/>
    <circle cx="160" cy="235" r="7" fill="url(#goldGrad)"/>
    <circle cx="352" cy="235" r="7" fill="url(#goldGrad)"/>
  </g>

  <!-- Dagger of the Mind (Central Spectral Dagger Pointing Downwards) -->
  <g>
    <!-- Crossguard -->
    <path d="M 230 255 C 245 258, 267 258, 282 255 L 285 264 C 265 268, 247 268, 227 264 Z" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1"/>
    <!-- Dagger Pommel & Grip -->
    <path d="M 252 220 L 260 220 L 259 255 L 253 255 Z" fill="url(#goldGrad)"/>
    <circle cx="256" cy="214" r="6" fill="#fef08a" stroke="#d97706" stroke-width="2"/>

    <!-- Sharp Steel Blade with Bloodline Ridge -->
    <path d="M 248 265 L 256 395 L 264 265 Z" fill="url(#bladeGrad)" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="256" y1="265" x2="256" y2="385" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="256" cy="397" r="2.5" fill="#f43f5e"/>
  </g>

  <!-- Bottom Arch Inscription Ring -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Cinzel', serif" font-size="14" font-weight="bold" letter-spacing="6" fill="#f59e0b" opacity="0.9">DUNSINANE • 1606</text>
</svg>